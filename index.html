<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World - Agentic AI UI Control System</title>
  <link rel="stylesheet" href="/public/assets/prompt-drawer/prompt-drawer.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #111827;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 1rem;
    }

    .helper-line {
      font-size: 1rem;
      color: #6b7280;
      margin-bottom: 2rem;
    }

    .cta-button {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      border: none;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .cta-button:hover {
      background: #2563eb;
    }

    .cta-button:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello World</h1>
    <p class="helper-line">Prompt Library installed. Use Cmd/Ctrl+L or Cmd/Ctrl+K.</p>
    <button class="cta-button" data-open-prompt-drawer>Open Prompt Library</button>
  </div>

  <script src="/public/assets/prompt-drawer/prompt-drawer.js" defer></script>
</body>
</html>
