<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World - Agentic AI UI Control System</title>
    <link rel="stylesheet" href="/public/assets/prompt-drawer/prompt-drawer.css">
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 600px;
        margin: 100px auto;
        padding: 20px;
        text-align: center;
        background: #ffffff;
        color: #111827;
        min-height: 100vh;
      }
      .notification-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background-color: #198754;
        color: white;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .notification-banner.hidden {
        display: none;
      }
      .notification-banner p {
        margin: 0;
        color: white;
        font-size: 14px;
      }
      .notification-banner .close-btn {
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        padding: 0 8px;
        line-height: 1;
        opacity: 0.8;
      }
      .notification-banner .close-btn:hover {
        opacity: 1;
      }
      h1 {
        font-size: 3rem;
        font-weight: 700;
        color: #111827;
        margin-bottom: 0.5rem;
      }
      h2 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 2rem;
      }
      .btn-group {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      button, .btn {
        background-color: #0d6efd;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 500;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        transition: background-color 0.2s ease;
      }
      button:hover, .btn:hover {
        background-color: #0b5ed7;
      }
      .btn-secondary {
        background-color: #6c757d;
      }
      .btn-secondary:hover {
        background-color: #5c636a;
      }
      kbd {
        background-color: rgba(255, 255, 255, 0.2);
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 13px;
        font-family: monospace;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div class="notification-banner" id="notificationBanner">
      <p>Prompt Library installed. Use Cmd/Ctrl+L or Cmd/Ctrl+K or click the button below.</p>
      <button class="close-btn" id="closeNotification" aria-label="Close notification">×</button>
    </div>

    <h1>Hello World</h1>
    <h2>Library</h2>
    <div class="btn-group">
      <button data-open-prompt-drawer>Prompt <kbd>⌘K</kbd></button>
      <a href="/ui-kit/" class="btn btn-secondary">UI Kit <kbd>⌘U</kbd></a>
    </div>
    <script src="/public/assets/prompt-drawer/prompt-drawer.js" defer></script>
    <script>
      // Handle notification banner dismissal
      const banner = document.getElementById('notificationBanner');
      const closeBtn = document.getElementById('closeNotification');

      // Check if banner was previously dismissed
      if (localStorage.getItem('notificationDismissed') === 'true') {
        banner.classList.add('hidden');
      }

      // Handle close button click
      closeBtn.addEventListener('click', () => {
        banner.classList.add('hidden');
        localStorage.setItem('notificationDismissed', 'true');
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'u') {
          e.preventDefault();
          window.location.href = '/ui-kit/';
        }
      });
    </script>
  </body>
</html>
