<!DOCTYPE html>
<html lang="en" data-theme="ai-default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="ai-component" content="ai-toolbar" />
  <meta name="ai-export" content="AIToolbar" />
  <title>AI Toolbar — Component Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
  *, *::before, *::after { box-sizing: border-box; }
  :root, [data-theme="ai-default"] {
    --ai-brand: #4D60E6;
    --ai-brand-hover: #3544A4;
    --ai-brand-surface: #F5F6FF;
    --ai-brand-border: #BECAFE;
    --ai-text: #2F2C3C;
    --ai-helper: #716E79;
    --ai-border: #DEDCDE;
    --ai-bg: #FFFFFF;
    --ai-page-bg: #F4F3F3;
    --ai-error: #B21111;
    --ai-error-bg: #FFEDE9;
    --ai-success: #0A6E5E;
    --ai-radius-sm: 6px;
    --ai-radius-md: 12px;
    --ai-radius-lg: 16px;
    --ai-card-radius: 16px;
    --ai-focus: #4D60E6;
  }
  body {
    margin: 0;
    font-family: "Open Sans", sans-serif;
    background: var(--ai-page-bg);
    color: var(--ai-text);
    line-height: 1.5;
  }
  .page { max-width: 960px; margin: 0 auto; padding: 40px 24px 64px; }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; }
  .subtitle { color: var(--ai-helper); font-size: 14px; margin: 0 0 8px; max-width: 760px; }
  .agent-path { font-size: 12px; color: var(--ai-helper); margin: 0 0 32px; font-family: monospace; }
  section { margin-bottom: 48px; }
  h2 { font-size: 16px; font-weight: 700; margin: 0 0 6px; }
  .section-desc { font-size: 13px; color: var(--ai-helper); margin: 0 0 20px; }
  .demo-surface {
    background: var(--ai-bg);
    border: 1px solid var(--ai-border);
    border-radius: var(--ai-radius-sm);
    padding: 28px 32px;
  }
  .state-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
  }
  .state-card { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .state-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: #87848D; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .btn-ai {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 16px; border-radius: var(--ai-radius-sm); border: none;
    background: var(--ai-brand); color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-ai:hover { background: var(--ai-brand-hover); }
  .btn-ai.secondary {
    background: transparent; color: var(--ai-brand);
    border: 1px solid var(--ai-brand-border);
  }
  .btn-ai.secondary:hover { background: var(--ai-brand-surface); }
  @keyframes ai-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ai-spin { animation: none !important; } }

      .ai-toolbar {
        display: inline-flex; align-items: center; gap: 4px; padding: 6px;
        background: var(--ai-bg); border: 1px solid var(--ai-border);
        border-radius: var(--ai-radius-md); box-shadow: 0 2px 8px rgba(26,22,40,0.06);
      }
      .ai-toolbar.vertical { flex-direction: column; }
      .ai-tb-btn {
        width: 36px; height: 36px; border: none; border-radius: var(--ai-radius-sm);
        background: transparent; color: var(--ai-text); cursor: pointer;
        display: flex; align-items: center; justify-content: center; font-size: 16px;
      }
      .ai-tb-btn:hover { background: var(--ai-brand-surface); color: var(--ai-brand); }
      .ai-tb-btn[aria-pressed="true"] { background: var(--ai-brand-surface); color: var(--ai-brand); border: 1px solid var(--ai-brand-border); }
      .ai-tb-sep { width: 1px; height: 24px; background: var(--ai-border); margin: 0 4px; }
    </style>
</head>
<body>
  <div class="page">
    <h1>AI Toolbar</h1>
    <p class="subtitle">Standalone HTML preview for <strong>AIToolbar</strong> — open this file directly or serve from the repo. Canonical React: <code>AIToolbar.tsx</code> in this folder.</p>
    <p class="agent-path">components/ai/molecules/ai-toolbar/ai-toolbar.preview.html</p>

    <section>
      <h2>Horizontal toolbar</h2>
      <p class="section-desc">Icon-link actions with AI brand hover and focus.</p>
      <div class="demo-surface row">
        <div class="ai-toolbar" role="toolbar" aria-label="Formatting">
          <button type="button" class="ai-tb-btn" title="Bold" aria-pressed="true">B</button>
          <button type="button" class="ai-tb-btn" title="Italic">I</button>
          <button type="button" class="ai-tb-btn" title="Link">🔗</button>
          <span class="ai-tb-sep" aria-hidden="true"></span>
          <button type="button" class="ai-tb-btn" title="Ask AI">✦</button>
        </div>
        <div class="ai-toolbar vertical" role="toolbar" aria-label="Side tools">
          <button type="button" class="ai-tb-btn" title="Pin">📌</button>
          <button type="button" class="ai-tb-btn" title="Expand">⤢</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
