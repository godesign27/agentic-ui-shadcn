<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../preview/ai-preview-shared.css" />
  <title>AI Brief Chip — Component Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    @keyframes brief-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    @media (prefers-reduced-motion: reduce) {
      .brief-chip__dot[data-status="running"] { animation: none; }
    }
    body { margin: 0; font-family: "Open Sans", sans-serif; background: var(--neutral-page-bg); color: var(--neutral-text); line-height: 1.5; }
    .page { max-width: 920px; margin: 0 auto; padding: 40px 24px 64px; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; }
    .subtitle { color: var(--neutral-text-helper); font-size: 14px; margin: 0 0 40px; }
    .nav-link { display: inline-block; margin-bottom: 24px; font-size: 13px; color: #5A6DFF; text-decoration: none; font-weight: 600; }
    section { margin-bottom: 48px; }
    h2 { font-size: 16px; font-weight: 700; margin: 0 0 6px; }
    .section-desc { font-size: 13px; color: var(--neutral-text-helper); margin: 0 0 20px; }
    .demo-surface { background: #fff; border: 1px solid var(--neutral-border-subtle); border-radius: 8px; padding: 32px; }

    .brief-chip {
      display: inline-flex; align-items: center; gap: 8px;
      border-radius: 100px; font-weight: 600; white-space: nowrap;
      border: 1px solid;
    }
    .brief-chip--sm { padding: 4px 10px; font-size: 12px; }
    .brief-chip--md { padding: 6px 12px; font-size: 13px; }
    .brief-chip--lg { padding: 8px 14px; font-size: 14px; }

    .brief-chip[data-status="default"]       { background: #F4F3F3; border-color: #DEDCDE; color: var(--neutral-text-helper); }
    .brief-chip[data-status="ready"]         { background: #E8F5E9; border-color: #A5D6A7; color: #2E7D32; }
    .brief-chip[data-status="missing"]       { background: #FBE9E7; border-color: #FFCCBC; color: #BF360C; }
    .brief-chip[data-status="edited"]        { background: var(--neutral-surface-muted); border-color: #DEDCDE; color: #5b5864; }
    .brief-chip[data-status="waiting-approval"] { background: #FEFBF4; border-color: #FFD68F; color: #A54F00; }
    .brief-chip[data-status="running"]       { background: var(--neutral-surface-muted); border-color: #DEDCDE; color: #5A6DFF; }

    .brief-chip__dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: currentColor;
    }
    .brief-chip[data-status="running"] .brief-chip__dot {
      animation: brief-pulse 1.4s ease-in-out infinite;
    }

    .chip-grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .state-card { display: flex; flex-direction: column; gap: 8px; }
    .state-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--neutral-text-helper); }
    .hero-chip { margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="page">
    <a class="nav-link" href="/preview/atoms-review.html">← All AI atoms review</a>
    <h1>AI Brief Chip</h1>
    <p class="subtitle">Status indicator for agent task briefs — each status uses a full semantic surface (bg, border, ink).</p>

    <section>
      <h2>Semantic surfaces</h2>
      <p class="section-desc">Background, border, dot, and label share a hue family per status. Running dot pulses at 1.4s.</p>
      <div class="demo-surface">
        <div class="hero-chip" id="hero"></div>
        <div class="chip-grid" id="status-grid"></div>
      </div>
    </section>

    <section>
      <h2>Size variants</h2>
      <div class="demo-surface">
        <div class="chip-grid" id="size-row"></div>
      </div>
    </section>

    <section>
      <h2>In context</h2>
      <div class="demo-surface" style="padding:0; overflow:hidden;">
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead>
            <tr style="background:var(--neutral-surface-muted); text-align:left;">
              <th style="padding:12px 16px; font-weight:600; color:#716E79;">Brief</th>
              <th style="padding:12px 16px; font-weight:600; color:#716E79;">Status</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const SEMANTIC = {
      default:            { label: 'default' },
      ready:              { label: 'ready' },
      missing:            { label: 'missing' },
      edited:             { label: 'edited' },
      'waiting-approval': { label: 'waiting-approval' },
      running:            { label: 'running' },
    };

    function briefChip(status, label, size = 'md') {
      const chip = document.createElement('span');
      chip.className = `brief-chip brief-chip--${size}`;
      chip.dataset.status = status;
      const dot = document.createElement('span');
      dot.className = 'brief-chip__dot';
      chip.append(dot, document.createTextNode(label));
      return chip;
    }

    document.getElementById('hero').appendChild(
      briefChip('waiting-approval', 'Awaiting approval', 'lg')
    );

    const grid = document.getElementById('status-grid');
    Object.entries(SEMANTIC).forEach(([status, { label }]) => {
      grid.appendChild(briefChip(status, label));
    });

    const sizeRow = document.getElementById('size-row');
    ['sm', 'md', 'lg'].forEach(sz => {
      sizeRow.appendChild(briefChip('running', 'running', sz));
    });

    const tbody = document.getElementById('table-body');
    [
      { name: 'Q3 Pipeline Brief', status: 'ready', label: 'ready' },
      { name: 'Territory Realignment', status: 'running', label: 'running' },
      { name: 'Quota Analysis', status: 'missing', label: 'missing' },
      { name: 'Comp Plan Draft', status: 'waiting-approval', label: 'Awaiting approval' },
    ].forEach(row => {
      const tr = document.createElement('tr');
      tr.style.borderTop = '1px solid #EBEBEB';
      tr.innerHTML = `<td style="padding:12px 16px;">${row.name}</td><td style="padding:12px 16px;"></td>`;
      tr.cells[1].appendChild(briefChip(row.status, row.label, 'sm'));
      tbody.appendChild(tr);
    });
  </script>
</body>
</html>
